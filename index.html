<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home Game Hub</title>

<meta name="theme-color" content="#08090d">
<meta name="description" content="Personal home game and web launcher.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#08090d;
  --panel:#11131b;
  --panel2:#171a24;
  --line:rgba(255,255,255,.09);
  --text:#f7f7fa;
  --muted:#9297a6;
  --purple:#795cff;
  --purple2:#a995ff;
  --blue:#4ca5ff;
  --green:#4ee2a1;
  --yellow:#ffd45c;
  --red:#ff687b;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 12% 0%,rgba(121,92,255,.22),transparent 30%),
    radial-gradient(circle at 90% 15%,rgba(76,165,255,.10),transparent 28%),
    var(--bg);
  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

button{
  color:inherit;
}

a{
  text-decoration:none;
  color:inherit;
}

/* TOP BAR */

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
  background:rgba(8,9,13,.78);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(20px);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:850;
}

.brand-icon{
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:linear-gradient(135deg,var(--purple),#4936c8);
  box-shadow:0 10px 30px rgba(121,92,255,.3);
}

.top-right{
  display:flex;
  align-items:center;
  gap:9px;
}

.clock{
  color:var(--muted);
  font-size:13px;
  padding:8px 11px;
}

.icon-btn{
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  border-radius:11px;
  background:rgba(255,255,255,.04);
  cursor:pointer;
  transition:.2s;
}

.icon-btn:hover{
  background:rgba(255,255,255,.09);
}

/* HERO */

.hero{
  max-width:1200px;
  margin:auto;
  padding:76px 5% 35px;
}

.greeting{
  color:var(--purple2);
  font-size:13px;
  font-weight:800;
  letter-spacing:1.7px;
  text-transform:uppercase;
  margin-bottom:15px;
}

.hero h1{
  font-size:clamp(42px,7vw,76px);
  line-height:.97;
  letter-spacing:-4px;
}

.hero h1 span{
  color:var(--purple2);
}

.hero p{
  color:var(--muted);
  max-width:650px;
  margin-top:19px;
  line-height:1.7;
}

/* NAV */

.nav{
  max-width:1200px;
  margin:auto;
  padding:0 5%;
}

.nav-inner{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:5px;
}

.nav-inner::-webkit-scrollbar{
  display:none;
}

.nav-btn{
  flex:0 0 auto;
  padding:10px 15px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.035);
  color:var(--muted);
  cursor:pointer;
  transition:.2s;
  font-size:12px;
  font-weight:700;
}

.nav-btn:hover,
.nav-btn.active{
  color:white;
  background:rgba(121,92,255,.18);
  border-color:rgba(121,92,255,.4);
}

/* SEARCH */

.search{
  position:relative;
  max-width:760px;
  margin-top:29px;
}

.search input{
  width:100%;
  height:57px;
  padding:0 50px;
  color:white;
  background:rgba(255,255,255,.055);
  border:1px solid var(--line);
  border-radius:15px;
  outline:none;
  transition:.2s;
}

.search input:focus{
  border-color:rgba(121,92,255,.7);
  box-shadow:0 0 0 4px rgba(121,92,255,.1);
}

.search input::placeholder{
  color:#717685;
}

.search-icon{
  position:absolute;
  left:18px;
  top:15px;
  color:var(--muted);
  font-size:22px;
}

/* MAIN */

main{
  max-width:1200px;
  margin:auto;
  padding:0 5% 90px;
}

.section{
  margin-top:38px;
  scroll-margin-top:90px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:16px;
}

.section-head h2{
  font-size:22px;
  letter-spacing:-.6px;
}

.section-head span{
  color:var(--muted);
  font-size:12px;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex:0 0 auto;
  padding:9px 13px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.035);
  color:var(--muted);
  cursor:pointer;
  font-size:12px;
  transition:.2s;
}

.category:hover,
.category.active{
  color:white;
  background:rgba(121,92,255,.18);
  border-color:rgba(121,92,255,.4);
}

/* APPS */

.apps{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}

.app{
  position:relative;
  min-height:205px;
  padding:19px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.025));
  transition:.22s;
}

.app:hover{
  transform:translateY(-5px);
  border-color:rgba(121,92,255,.42);
  background:linear-gradient(145deg,rgba(121,92,255,.11),rgba(255,255,255,.025));
}

.app-icon{
  width:55px;
  height:55px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(135deg,#282b3a,#151720);
  border:1px solid var(--line);
  font-size:23px;
}

.app-top{
  display:flex;
  justify-content:space-between;
}

.star{
  width:32px;
  height:32px;
  border:0;
  border-radius:9px;
  background:rgba(255,255,255,.04);
  color:#737887;
  cursor:pointer;
  font-size:17px;
}

.star.active{
  color:var(--yellow);
}

.app h3{
  margin-top:17px;
  font-size:16px;
}

.app p{
  margin-top:6px;
  min-height:39px;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}

.launch{
  position:absolute;
  left:19px;
  right:19px;
  bottom:17px;
  height:37px;
  display:flex;
  justify-content:center;
  align-items:center;
